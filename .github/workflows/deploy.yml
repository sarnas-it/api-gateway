name: Build and Deploy Gateway

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: basili4-1982
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/basili4-1982/api-gateway:${{ github.sha }}
            ghcr.io/basili4-1982/api-gateway:latest

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy gateway config to server (first deploy only)
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            mkdir -p /opt/new-cml/configs
            if [ ! -f /opt/new-cml/configs/gateway.yaml ]; then
              exit 0
            fi
          " && scp -i ~/.ssh/deploy_key -P ${{ secrets.DEPLOY_PORT }} \
            config.yaml \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/new-cml/configs/gateway.yaml || true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 5m
          script: |
            cd /opt/new-cml
            export API_GATEWAY_IMAGE_TAG=${{ github.sha }}
            grep -q '^API_GATEWAY_IMAGE_TAG=' .env && sed -i "s|^API_GATEWAY_IMAGE_TAG=.*|API_GATEWAY_IMAGE_TAG=${API_GATEWAY_IMAGE_TAG}|" .env || printf 'API_GATEWAY_IMAGE_TAG=%s\n' "${API_GATEWAY_IMAGE_TAG}" >> .env
            docker compose -f docker-compose.stage.yml pull api-gateway
            docker compose -f docker-compose.stage.yml up -d --force-recreate api-gateway
            docker image prune -f || true
