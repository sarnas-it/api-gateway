name: Deploy to XD

on:
  push:
    branches: [develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=sha,prefix=
      - uses: docker/build-push-action@v5
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.XD_HOST }}
          username: ${{ secrets.XD_USER }}
          key: ${{ secrets.XD_SSH_KEY }}
          port: ${{ secrets.XD_PORT }}
          script: |
            cd /opt/new-cml
            TAG=${GITHUB_SHA::7}
            sudo sed -i "s|^API_GATEWAY_IMAGE_TAG=.*|API_GATEWAY_IMAGE_TAG=$TAG|" .env
            sudo docker-compose -f docker-compose.stage.yml pull api-gateway
            sudo docker-compose -f docker-compose.stage.yml up -d api-gateway
