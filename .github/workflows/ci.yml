name: CI Build

on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DASHBOARD_IMAGE_NAME: ghcr.io/sarnas-it/api-gateway-dashboard

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        id: lint
        continue-on-error: true
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint run ./... --output.json.path=lint-report.json --issues-exit-code 0

      - name: Create/update lint issue
        if: always()
        continue-on-error: true
        run: |
          type gh &>/dev/null || sudo apt-get install -y -qq gh
          scripts/lint-to-issues.sh

      - name: Fail on lint errors
        if: steps.lint.outcome != 'success'
        run: |
          echo "❌ Lint errors found. Issue created/updated."
          exit 1

      - name: Govulncheck
        continue-on-error: true
        uses: kmulvey/govulncheck-action@v1.5.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go test
        run: go test ./... -count=1

  xgate:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build xgate
        run: go build -o /tmp/xgate ./cmd/xgate

      - name: Build standard gateway
        run: /tmp/xgate build --src . --output /tmp/gateway

      - name: Test DNS modules
        run: |
          for d in modules/dns/*; do
            (cd "$d" && go test ./...)
          done

      - name: Build with DNS modules
        run: |
          /tmp/xgate build --src . \
            --with code.sarnas.ru/xgate-modules/dns-cloudflare=./modules/dns/cloudflare \
            --with code.sarnas.ru/xgate-modules/dns-desec=./modules/dns/desec \
            --with code.sarnas.ru/xgate-modules/dns-digitalocean=./modules/dns/digitalocean \
            --with code.sarnas.ru/xgate-modules/dns-route53=./modules/dns/route53 \
            --output /tmp/gateway-dns

      - name: Verify binaries
        run: test -x /tmp/gateway && test -x /tmp/gateway-dns

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Публикация в org-пакет ghcr требует PAT с write:packages
          # (GITHUB_TOKEN GitHub отклоняет: write_package denied).
          password: ${{ secrets.GHCR_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
            BUILD_RUN_ID=${{ github.run_id }}

  build-dashboard:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Публикация в org-пакет ghcr требует PAT с write:packages
          # (GITHUB_TOKEN GitHub отклоняет: write_package denied).
          password: ${{ secrets.GHCR_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DASHBOARD_IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push dashboard
        uses: docker/build-push-action@v5
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          file: Dockerfile.dashboard
          push: true
          tags: ${{ steps.meta.outputs.tags }}
