name: Deploy to Preprod

on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Lint check passed"
  deploy:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=sha,prefix=preprod_
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PREPROD_HOST }}
          username: ${{ secrets.PREPROD_USER }}
          key: ${{ secrets.PREPROD_SSH_KEY }}
          port: ${{ secrets.PREPROD_PORT }}
          script: |
            cd /opt/new-cml-preprod/preprod
            TAG=preprod_${GITHUB_SHA::7}
            sudo sed -i "s|^API_GATEWAY_IMAGE_TAG=.*|API_GATEWAY_IMAGE_TAG=$TAG|" .env
            sudo docker-compose -f docker-compose.preprod.yml pull api-gateway
            sudo docker-compose -f docker-compose.preprod.yml up -d api-gateway
