# Local override config — copy to config.local.yaml and adjust
# gitignored, not committed

server:
  port: 8080

application:
  env: "dev"
  health_check: false
  # Размер пула keep-alive соединений к каждому таргету. Должен быть не меньше
  # пиковой конкурентности к таргету, иначе под нагрузкой транспорт постоянно
  # переоткрывает соединения и RPS падает. По умолчанию 1000.
  max_idle_conns_per_host: 1000
  # metrics_enabled: true         # /metrics + active-requests счётчик; выкл. по умолчанию (доп. расходы на запрос)
  # metrics_allowed_ips: ["10.0.0.5"]

# TLS with auto certificates (Let's Encrypt)
# Uncomment for production:
# tls:
#   enabled: true
#   port: 443
#   http_port: 80
#   domains:
#     - "api.yourdomain.com"
#   email: "admin@yourdomain.com"
#   cache_dir: "/var/lib/api-gateway/certs"
#   staging: false
#   redirect_http: true

targets:
  - name: "auth-api"
    url: "http://localhost:9001"
    timeout: 10s
    path_prefix: "/api/v1/auth"
    strip_prefix: false

  - name: "client-api"
    url: "http://localhost:9002"
    timeout: 30s
    path_prefix: "/api/v1/client"
    strip_prefix: false

  - name: "admin-api"
    url: "http://localhost:9003"
    timeout: 30s
    path_prefix: "/api/v1/admin"
    strip_prefix: false

  - name: "storage-api"
    url: "http://localhost:9004"
    timeout: 60s
    path_prefix: "/api/v1/storage"
    strip_prefix: false

routing:
  rules:
    - path_prefix: "/api/v1/auth/login"
      target_name: "auth-api"
      methods: ["POST"]
      strip_path: false
      rate_limit:
        requests_per_second: 10
        burst: 20

    - path_prefix: "/api/v1/auth/register"
      target_name: "auth-api"
      methods: ["POST"]
      strip_path: false
      rate_limit:
        requests_per_second: 5
        burst: 10

    - path_prefix: "/api/v1/auth/refresh"
      target_name: "auth-api"
      methods: ["POST"]
      strip_path: false
      auth:
        required: false
      rate_limit:
        requests_per_second: 10
        burst: 20

    - path_prefix: "/api/v1/auth"
      target_name: "auth-api"
      strip_path: false
      auth:
        required: true
      rate_limit:
        requests_per_second: 30
        burst: 50

    - path_prefix: "/api/v1/client"
      target_name: "client-api"
      strip_path: false
      auth:
        required: true
        roles: ["user", "admin"]
      rate_limit:
        requests_per_second: 100
        burst: 200

    - path_prefix: "/api/v1/admin"
      target_name: "admin-api"
      strip_path: false
      auth:
        required: true
        roles: ["admin"]
        strip_token: false
      rate_limit:
        requests_per_second: 50
        burst: 100

    - path_prefix: "/api/v1/storage/public"
      target_name: "storage-api"
      strip_path: false
      auth:
        required: false
      rate_limit:
        requests_per_second: 20
        burst: 40

    - path_prefix: "/api/v1/storage"
      target_name: "storage-api"
      strip_path: false
      auth:
        required: true
      rate_limit:
        requests_per_second: 30
        burst: 50

jwt:
  secret_key: "change-me-to-a-secure-secret-at-least-256-bits-long"
  algorithm: "HS256"
  validate_exp: true
  validate_iss: false
  validate_aud: false
  required: false
  claim_mappings:
    - "id"
    - "email"
    - "roles"

headers:
  strip_authorization: true
  claim_to_header:
    id: "X-User-ID"
    email: "X-User-Email"
    roles: "X-User-Roles"
  add_headers:
    X-Gateway-Version: "1.0.0"
    X-Gateway-Name: "API-Gateway"

logging:
  level: "debug"
  format: "console"
  # access_log: true              # построчный лог каждого запроса; выкл. по умолчанию (доп. расходы на запрос)

# Service discovery (Docker/Podman по labels). Если enabled: true, targets и
# routing.rules можно не заполнять — сервисы опишут себя labels'ами.
# Дефолты ниже применяются при enabled: true; можно оставить только
# `discovery: { enabled: true }` — остальные поля подставятся автоматически.
discovery:
  enabled: false
  provider: docker            # docker | podman (один и тот же клиент)
  host: "unix:///var/run/docker.sock"
  api_version: "v1.41"        # "" = запросы без версии
  label_prefix: "gateway"
  service_name_labels:
    - "com.docker.compose.service"
    - "io.podman.compose.service"
  network: ""
  debounce: 500ms
  resync_interval: 5m
  default_timeout: 30s
  # Аварийный фолбэк: последний удачный результат discovery (маршруты переживают
  # рестарт при недоступном Docker/Podman). "" отключает персист.
  state_file: /var/lib/api-gateway/discovery-state.json
