# Local override config — copy to config.local.yaml and adjust
# gitignored, not committed

server:
  port: 8080
  # h2c: true   # cleartext HTTP/2 для gRPC-клиентов

# Gzip-сжатие ответов (выключено по умолчанию).
# compression:
#   enabled: true
#   level: 5
#   min_size: 1024

# HTTP/3 (QUIC) поверх TLS; нужен UDP-порт и rmem_max.
# http3:
#   enabled: true
#   port: 443

# Loopback admin API (status/reload); token — из env.
# admin:
#   enabled: true
#   addr: "127.0.0.1:2019"
#   token: "$${ADMIN_TOKEN}"

# Параметры compile-time xgate-модулей.
# plugins:
#   example:
#     header: "X-Tenant"

application:
  env: "dev"
  health_check: false
  # Размер пула keep-alive соединений к каждому таргету. Должен быть не меньше
  # пиковой конкурентности к таргету, иначе под нагрузкой транспорт постоянно
  # переоткрывает соединения и RPS падает. По умолчанию 1000.
  max_idle_conns_per_host: 1000
  # metrics_enabled: true         # /metrics + active-requests счётчик; выкл. по умолчанию (доп. расходы на запрос)
  # metrics_allowed_ips: ["10.0.0.5"]

# TLS with auto certificates (Let's Encrypt)
# Uncomment for production:
# tls:
#   enabled: true
#   port: 443
#   http_port: 80
#   domains:
#     - "api.yourdomain.com"
#   email: "admin@yourdomain.com"
#   cache_dir: "/var/lib/api-gateway/certs"
#   staging: false                # true → ACME staging CA + cache_dir/staging
#   directory_url: ""             # необязательно: свой ACME directory URL (перекрывает staging)
#   redirect_http: true
#   # min_version: "1.3"
#   # cipher_suites: ["TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256"]
#   # curves: ["X25519", "P-256"]
#   # client_auth: "verify"          # mTLS на основном :443
#   # client_ca_file: "/etc/api-gateway/clients-ca.pem"
#   # Wildcard-домены: DNS-01 через API reg.ru (секреты — из env).
#   # dns_provider: "regru"
#   # dns_username: "$${REGRU_USER}"
#   # dns_password: "$${REGRU_PASSWORD}"
#   # dns_propagation_timeout: 5m
#   # Отдельный mTLS-листенер для /api/v1/workers/*; 0 — выключен.
#   worker_port: 8444
#   # PEM-файл CA для проверки клиентских сертификатов (обязателен при worker_port > 0).
#   worker_client_ca_file: "/etc/api-gateway/worker-ca.pem"

targets:
  - name: "auth-api"
    url: "http://localhost:9001"
    timeout: 10s
    path_prefix: "/api/v1/auth"
    strip_prefix: false

  - name: "client-api"
    url: "http://localhost:9002"
    timeout: 30s
    path_prefix: "/api/v1/client"
    strip_prefix: false

  - name: "admin-api"
    url: "http://localhost:9003"
    timeout: 30s
    path_prefix: "/api/v1/admin"
    strip_prefix: false

  - name: "storage-api"
    url: "http://localhost:9004"
    timeout: 60s
    path_prefix: "/api/v1/storage"
    strip_prefix: false

routing:
  # Матчеры правила складываются по И: host, methods, headers, query и один из
  # path_prefix/path_regex. Пример:
  #   - path_regex: "^/api/v[0-9]+/"
  #     target_name: "api-v2"
  #   - path_prefix: "/api"
  #     target_name: "api-v1"
  #     headers: {X-Api-Version: "1"}
  # lb_policy: round_robin | random | least_conn | ip_hash | sticky
  # sticky привязывает клиента к таргету cookie xg_target (сессионные бэкенды).
  rules:
    - path_prefix: "/api/v1/auth/login"
      target_name: "auth-api"
      methods: ["POST"]
      strip_path: false
      rate_limit:
        requests_per_second: 10
        burst: 20

    - path_prefix: "/api/v1/auth/register"
      target_name: "auth-api"
      methods: ["POST"]
      strip_path: false
      rate_limit:
        requests_per_second: 5
        burst: 10

    # admin-backend (внутренний сервис админки): JWT-проверка + подпись HMAC v3.
    # Реальный secret задаётся только в приватном конфиге/на сервере.
    - path_prefix: "/api/v1/jobs"
      target_name: "admin-backend"
      strip_path: false
      auth:
        required: true
      sign_v3:
        service_id: "admin-front"
        key_id: "1"
        secret: "change-me"

    - path_prefix: "/api/v1/auth/refresh"
      target_name: "auth-api"
      methods: ["POST"]
      strip_path: false
      auth:
        required: false
      rate_limit:
        requests_per_second: 10
        burst: 20

    - path_prefix: "/api/v1/auth"
      target_name: "auth-api"
      strip_path: false
      auth:
        required: true
      rate_limit:
        requests_per_second: 30
        burst: 50

    - path_prefix: "/api/v1/client"
      target_name: "client-api"
      strip_path: false
      auth:
        required: true
        roles: ["user", "admin"]
      rate_limit:
        requests_per_second: 100
        burst: 200

    - path_prefix: "/api/v1/admin"
      target_name: "admin-api"
      strip_path: false
      auth:
        required: true
        roles: ["admin"]
        strip_token: false
      rate_limit:
        requests_per_second: 50
        burst: 100

    - path_prefix: "/api/v1/storage/public"
      target_name: "storage-api"
      strip_path: false
      auth:
        required: false
      rate_limit:
        requests_per_second: 20
        burst: 40

    - path_prefix: "/api/v1/storage"
      target_name: "storage-api"
      strip_path: false
      auth:
        required: true
      rate_limit:
        requests_per_second: 30
        burst: 50

jwt:
  secret_key: "change-me-to-a-secure-secret-at-least-256-bits-long"
  algorithm: "HS256"
  validate_exp: true
  validate_iss: false
  validate_aud: false
  required: false
  claim_mappings:
    - "id"
    - "email"
    - "roles"

# Федерация внешней идентичности (партнёрский HS256-JWT).
# ВАЖНО: identity.providers[].secret_key ОТЛИЧАЕТСЯ от jwt.secret_key.
# Значения ниже — заглушки; реальные секреты задаются вне публичного репозитория.
identity:
  enabled: false
  selection: []
  user_lookup:
    service_url: "http://passport-service:8085"
    hmac_secret: "change-me"          # = HMAC_SECRET паспорта
    cache_ttl: 300s
  providers:
    - name: "partner"
      enabled: false
      algorithm: "HS256"
      secret_key: "change-me"        # секрет партнёра (≠ jwt.secret_key)
      # RS256 через удалённый JWKS (альтернатива secret_key/public_key_file):
      # jwks_url: "https://cml/.well-known/jwks"
      validate_exp: true
      validate_iss: false
      expected_iss: ""
      email_claim: "email"
      # Резолв по субъекту: passport GET /api/v1/internal/user-by-subject
      # (provider=<subject_provider>, subject=<sub из токена>), фолбэк — email.
      # subject_provider — значение auth_provider в passport; пусто = выключено.
      # subject_provider: "cml"
      # subject_claim: "sub"

headers:
  strip_authorization: true
  claim_to_header:
    id: "X-User-ID"
    email: "X-User-Email"
    roles: "X-User-Roles"
  add_headers:
    X-Gateway-Version: "1.0.0"
    X-Gateway-Name: "API-Gateway"

logging:
  level: "debug"
  format: "console"            # json | console | text (text — алиас console)
  # access_log: true              # построчный лог каждого запроса; выкл. по умолчанию (доп. расходы на запрос)

# Service discovery (Docker/Podman по labels). Если enabled: true, targets и
# routing.rules можно не заполнять — сервисы опишут себя labels'ами.
# Дефолты ниже применяются при enabled: true; можно оставить только
# `discovery: { enabled: true }` — остальные поля подставятся автоматически.
discovery:
  enabled: false
  provider: docker            # docker | podman (один и тот же клиент)
  host: "unix:///var/run/docker.sock"
  api_version: "v1.41"        # "" = запросы без версии
  label_prefix: "gateway"
  service_name_labels:
    - "com.docker.compose.service"
    - "io.podman.compose.service"
  network: ""
  debounce: 500ms
  resync_interval: 5m
  default_timeout: 30s
  # Аварийный фолбэк: последний удачный результат discovery (маршруты переживают
  # рестарт при недоступном Docker/Podman). "" отключает персист.
  state_file: /var/lib/api-gateway/discovery-state.json

# Вебхуки/NATS: публикация событий on_request/on_response.
# Для объёмного аудита (событие на каждый запрос) включайте батчинг: события
# копятся и уходят одним POST телом {"count":N,"events":[...]}, очередь
# ограничена, при переполнении постановка блокируется (потерь нет).
# webhooks:
#   - name: "audit"
#     transport: "webhook"          # webhook | nats
#     webhook_url: "https://audit.example/events"
#     trigger: "on_response"
#     methods: ["POST", "PUT", "PATCH", "DELETE"]
#     batch_size: 1000              # >1 включает батчинг (0/1 — по одному событию)
#     flush_interval: 100ms         # максимальная задержка перед отправкой пачки
