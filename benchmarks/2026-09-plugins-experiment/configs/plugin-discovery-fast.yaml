# Plugin perf experiment: Docker service discovery served by the discovery plugin over
# the fast transport. A static target/route keeps proxying working while discovery runs
# as control plane; routes may additionally come from Docker labels.
server:
  port: 18080
application:
  env: "prod"
  health_check: false
  circuit_breaker: false
  metrics_enabled: false
plugins:
  enabled: true
  discovery:
    path: bin/plugins/discovery
    transport: fast
# Gateway core always builds a JWT validator, so an (unused) secret is required.
jwt:
  required: false
  secret_key: "benchsecret"
targets:
  - name: "backend"
    url: "http://127.0.0.1:19901"
    timeout: 30s
routing:
  rules:
    - path_prefix: "/"
      target_name: "backend"
discovery:
  enabled: true
  provider: docker
  host: "unix:///var/run/docker.sock"
  label_prefix: "gateway"
  debounce: 1s
  resync_interval: 1m
logging:
  level: "error"
  access_log: false
