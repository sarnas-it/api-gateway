server:
  port: 80
  read_timeout: 5s
  write_timeout: 30s
  idle_timeout: 120s

application:
  env: "prod"
  health_check: false
  circuit_breaker: false

permissions:
  api_key: "change-me"

jwt:
  required: false
  secret_key: "change-me"
  validate_exp: false
  validate_iss: false
  validate_aud: false
  claim_mappings:
    - "id"
    - "email"
    - "roles"

targets:
  - name: "passport"
    url: "http://passport-service:8085"
    timeout: 10s
    health_check: "http://passport-service:8085/health"

  - name: "yii3-backend"
    url: "http://yii3-backend:8081"
    timeout: 30s
    health_check: "http://yii3-backend:8081/health"

  - name: "frontend"
    url: "http://frontend:80"
    timeout: 10s
    health_check: "http://frontend:80/health"

  - name: "admin-frontend"
    url: "http://admin-front:80"
    timeout: 10s
    health_check: "http://admin-front:80/health"

  - name: "fgis-syncer"
    url: "http://fgis-syncer:8080"
    timeout: 60s
    health_check: "http://fgis-syncer:8080/health"

  - name: "fgis-writer"
    url: "http://fgis-writer:8083"
    timeout: 30s
    health_check: "http://fgis-writer:8083/health"

  - name: "document-service"
    url: "http://document-service:8070"
    timeout: 30s
    health_check: "http://document-service:8070/health"

  - name: "monitoring-report-engine"
    url: "http://monitoring-report-engine:8080"
    timeout: 60s
    health_check: "http://monitoring-report-engine:8080/health"

  - name: "activity-service"
    url: "http://activity-service:8071"
    timeout: 30s
    health_check: "http://activity-service:8071/health"

  - name: "notification-service"
    url: "http://notification-service:9090"
    timeout: 30s
    health_check: "http://notification-service:9090/health"

  - name: "permission-service"
    url: "http://permission-service:8084"
    timeout: 10s
    health_check: "http://permission-service:8084/health"

  - name: "audit-consumer"
    url: "http://audit-consumer:9190"
    timeout: 10s
    health_check: "http://audit-consumer:9190/health"

  - name: "lifecycle-engine"
    url: "http://lifecycle-engine:8080"
    timeout: 10s
    health_check: "http://lifecycle-engine:8080/healthz"

  - name: "calendar-service"
    url: "http://calendar-service:8090"
    timeout: 10s
    health_check: "http://calendar-service:8090/health"

routing:
  rules:
    - path_prefix: "/api/auth/methods"
      target_name: "passport"
      strip_path: false
      auth:
        required: false

    - path_prefix: "/api/auth/login"
      target_name: "passport"
      strip_path: false
      auth:
        required: false

    - path_prefix: "/api/auth/refresh"
      target_name: "passport"
      strip_path: false
      auth:
        required: false

    - path_prefix: "/api/auth"
      target_name: "passport"
      strip_path: false
      auth:
        required: true

    - path_prefix: "/api/fgis"
      target_name: "fgis-syncer"
      strip_path: true
      auth:
        required: true

    - path_prefix: "/api/admin/fgis"
      target_name: "fgis-syncer"
      strip_path: true
      auth:
        required: true

    - path_prefix: "/api/reports"
      target_name: "monitoring-report-engine"
      strip_path: false
      auth:
        required: true

    - path_prefix: "/api/report-templates"
      target_name: "monitoring-report-engine"
      strip_path: false
      auth:
        required: true

    - path_prefix: "/api/report-runs"
      target_name: "monitoring-report-engine"
      strip_path: false
      auth:
        required: true

    - path_prefix: "/api/monitoring/aggregation"
      target_name: "monitoring-report-engine"
      strip_path: false
      auth:
        required: true

    - path_prefix: "/api/monitoring"
      target_name: "monitoring-report-engine"
      strip_path: false
      auth:
        required: true

    - path_prefix: "/api/admin/monitoring"
      target_name: "monitoring-report-engine"
      strip_path: false
      auth:
        required: true

    - path_prefix: "/api/admin/generate-import-mapping"
      target_name: "monitoring-report-engine"
      strip_path: false
      auth:
        required: true

    - path_prefix: "/api/admin/templates"
      target_name: "monitoring-report-engine"
      strip_path: false
      auth:
        required: true

    - path_prefix: "/api/forms"
      target_name: "monitoring-report-engine"
      strip_path: false
      auth:
        required: true

    - path_prefix: "/api/notifications/rules"
      target_name: "notification-service"
      strip_path: false
      auth:
        required: true

    - path_prefix: "/api/admin/notification-channels"
      target_name: "notification-service"
      strip_path: false
      auth:
        required: true

    - path_prefix: "/api/notifications/templates"
      target_name: "notification-service"
      strip_path: false
      auth:
        required: true

    - path_prefix: "/api/notifications/config"
      target_name: "notification-service"
      strip_path: false
      auth:
        required: true

    - path_prefix: "/api/admin/sessions"
      target_name: "passport"
      strip_path: false
      auth:
        required: true

    - path_prefix: "/api/admin/audit"
      target_name: "yii3-backend"
      strip_path: false
      auth:
        required: true

    - path_prefix: "/api/admin/roles"
      target_name: "permission-service"
      strip_path: false
      auth:
        required: true

    - path_prefix: "/api/admin/permissions"
      target_name: "permission-service"
      strip_path: false
      auth:
        required: true

    - path_prefix: "/api/documents/generate"
      target_name: "yii3-backend"
      strip_path: false
      auth:
        required: true

    - path_prefix: "/api/documents"
      target_name: "document-service"
      strip_path: false
      auth:
        required: true

    - path_prefix: "/api/audit-log"
      target_name: "audit-consumer"
      strip_path: false
      auth:
        required: true

    - path_prefix: "/api/permissions"
      target_name: "permission-service"
      strip_path: false
      auth:
        required: true

    - path_prefix: "/api/admin/lifecycle"
      target_name: "lifecycle-engine"
      strip_path: false
      auth:
        required: true

    - path_prefix: "/api/workflow"
      target_name: "lifecycle-engine"
      strip_path: false
      auth:
        required: true

    - path_prefix: "/api/inbox"
      target_name: "lifecycle-engine"
      strip_path: false
      auth:
        required: true

    - path_prefix: "/api/files"
      target_name: "document-service"
      strip_path: false
      auth:
        required: true

    - path_prefix: "/api/activity"
      target_name: "activity-service"
      strip_path: false
      auth:
        required: true

    - path_prefix: "/api/calendar"
      target_name: "calendar-service"
      strip_path: false
      auth:
        required: true

    - path_prefix: "/api"
      target_name: "yii3-backend"
      strip_path: false
      auth:
        required: true

    - path_prefix: "/admin"
      target_name: "admin-frontend"
      strip_path: true

    - path_prefix: "/"
      target_name: "frontend"
      strip_path: false

headers:
  strip_authorization: false
  sign_header: "X-User-Signature"
  claim_to_header:
    id: "X-User-ID"
    email: "X-User-Email"
    roles: "X-User-Roles"
  add_headers:
    X-API-Key: "change-me"
    X-User-Signature: "change-me"
  cors:
    enabled: true
    allowed_origins: ["*"]
    allowed_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS", "HEAD"]
    allowed_headers: ["Origin", "Content-Type", "Accept", "Authorization", "X-Request-ID", "X-User-ID", "X-User-Email", "X-User-Roles", "X-API-Key"]
    expose_headers: ["X-User-ID", "X-User-Email", "X-User-Roles", "X-Proxy", "X-Request-ID", "Authorization", "Content-Disposition"]
    max_age: 86400

webhooks:
  # Аудит мутирующих запросов — через NATS в audit-consumer
  - name: "audit"
    transport: nats
    nats_url: "nats://nats:4222"
    subject: "audit.events"
    trigger: on_request
    methods: ["POST", "PUT", "PATCH", "DELETE"]
    exclude_paths: ["/health", "/ready", "/metrics"]
    async: true

  # ETL-события об изменениях данных — замена EtlService::publish()
  - name: "resource-change"
    transport: nats
    nats_url: "nats://nats:4222"
    subject: "cml.events"
    trigger: on_response
    methods: ["POST", "PUT", "PATCH", "DELETE"]
    on_status_codes: [200, 201, 204]
    exclude_paths: ["/health", "/ready", "/metrics"]
    async: true

logging:
  level: "info"
  format: "console"
